name: eco_ai_tracker
description: A lucid AI usage tracker measuring environmental and financial impact.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.4.9
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Local Database (Offline First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI/UX
  google_fonts: ^6.1.0  # Pour Inter/Space Grotesk
  flutter_animate: ^4.5.0 # Pour les animations fluides
  glass_kit: ^3.0.0 # Pour l'effet Glassmorphism rapide
  fl_chart: ^0.66.0 # Pour les graphiques

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  path_provider: ^2.1.2
  flutter_secure_storage: ^10.0.0
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
